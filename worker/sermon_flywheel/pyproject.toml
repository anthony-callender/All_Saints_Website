[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sermon-worker"
version = "1.0.0"
description = "All Saints' Sermon Flywheel: YouTube service -> sermon transcript/audio -> structured notes -> WordPress draft."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "pydantic>=2.5",
  "openai>=1.40",
  "yt-dlp>=2024.1",
  "pypdf>=4",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sermon-worker = "sermon_worker.cli:main"

[tool.setuptools]
packages = ["sermon_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
